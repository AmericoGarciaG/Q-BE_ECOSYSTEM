[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qbe_observatory"
version = "0.1.0"
description = "Q-BE Observatory — read-only calibration and backtesting surface"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["app", "app.adapters", "app.routes", "app.services", "src.observatory", "src.observatory.core"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/css/*.css"]
