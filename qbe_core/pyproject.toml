[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qbe_core"
version = "0.1.0"
description = "Q-BE Canonical Mathematical Core — Fase 1"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.7",
]

[tool.setuptools]
packages = ["src.core", "src.core.contracts", "src.core.normalization", "src.core.sovereign", "src.models"]

[tool.setuptools.package-dir]
"" = "."
